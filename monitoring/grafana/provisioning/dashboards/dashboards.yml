apiVersion: 1

# 대시보드 프로비저닝 provider
#
# 마운트 계약
#   이 파일   -> /etc/grafana/provisioning/dashboards/dashboards.yml
#   JSON 묶음 -> /var/lib/grafana/dashboards
#
# foldersFromFilesStructure를 켰으므로 /var/lib/grafana/dashboards 아래의 디렉터리
# 이름이 그대로 Grafana 폴더 이름이 된다. 저장소의 dashboards/BNGdrasil/*.json은
# Grafana에서 "BNGdrasil" 폴더로 나타난다. 이 설정을 쓸 때는 folder와 folderUid를
# 비워 두어야 하며, 값을 넣으면 디렉터리 구조 대신 그 폴더가 우선한다.
#
# allowUiUpdates: false 이므로 화면에서 고친 내용은 저장되지 않는다. 대시보드는
# 저장소의 JSON이 유일한 정의이며, 변경은 JSON을 고쳐서 반영한다.
#
# disableDeletion은 false로 둔다. 이 값은 화면에서의 삭제를 막는 설정이 아니라,
# JSON 파일이 사라졌을 때 Grafana가 그 대시보드를 지울지를 정하는 설정이다. true로
# 두면 파일을 지우고 배포해도 대시보드가 그대로 남아서 "저장소가 단일 출처"라는
# 방침이 깨진다. grafana/grafana:12.2.1로 두 값을 모두 시험해서 확인했고, 결과는
# monitoring/README.md의 "대시보드 프로비저닝" 항목에 적어 두었다. 화면에서 손으로
# 고치거나 지우는 일은 allowUiUpdates: false와 읽기 전용 mount가 막는다.

providers:
  - name: 'BNGdrasil'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
