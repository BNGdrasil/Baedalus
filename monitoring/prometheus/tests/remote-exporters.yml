# promtool 단위 시험
#
# 실행 방법(저장소 루트의 monitoring/ 디렉터리에서)
#   docker run --rm --entrypoint promtool \
#     -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.7.2 \
#     test rules /etc/prometheus/tests/remote-exporters.yml
#
# VM1 nginx exporter와 VM3 postgres exporter의 규칙이 의도한 시점에 발화하는지
# 확인한다. 두 지표 이름은 고정한 exporter 버전에서 실제로 노출하는 것을 그대로
# 사용했다. postgres_exporter 0.20.1이 pg_up을, nginx-prometheus-exporter
# 1.5.3이 nginx_up을 내보낸다.
#
# rule_files 경로는 컨테이너 안의 절대 경로이며, 위 실행 방법의 mount 위치와 같다.

rule_files:
  - /etc/prometheus/rules/basic.yml

evaluation_interval: 30s

tests:
  # PostgreSQL에 접속하지 못하는 상황이다. exporter의 /metrics는 계속 응답하므로
  # up은 1이고 pg_up만 0으로 떨어진다. TargetDown으로는 잡히지 않는 구간이다.
  - interval: 30s
    input_series:
      - series: 'pg_up{job="vm3-postgres",instance="vm3",role="database"}'
        values: '0x30'
      - series: 'up{job="vm3-postgres",instance="vm3",role="database"}'
        values: '1x30'
    alert_rule_test:
      # 4분 시점에는 for: 5m을 채우지 못했으므로 아직 발화하지 않는다.
      - eval_time: 4m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: postgres
              job: vm3-postgres
              instance: vm3
              role: database
            exp_annotations:
              summary: 'VM3 PostgreSQL exporter가 5분 넘게 데이터베이스에 접속하지 못한다'
              description: 'exporter 프로세스는 살아 있으나 접속에 실패하고 있다. 데이터베이스 중단이거나 인증 정보가 어긋난 상태다. 이 경보는 5432번 포트의 17 클러스터만 대상으로 한다.'
              action: 'VM3에서 journalctl -u bngdrasil-postgres-exporter -n 50 으로 접속 오류를 확인하고, systemctl status postgresql 과 /etc/bngdrasil-exporters/postgres-exporter.env 의 접속 문자열을 점검한다.'
      # up이 1로 유지되므로 TargetDown은 함께 울리지 않는다.
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts: []

  # PostgreSQL 접속이 정상이면 발화하지 않는다.
  - interval: 30s
    input_series:
      - series: 'pg_up{job="vm3-postgres",instance="vm3",role="database"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresDown
        exp_alerts: []

  # nginx stub_status를 읽지 못하는 상황이다.
  - interval: 30s
    input_series:
      - series: 'nginx_up{job="vm1-nginx",instance="vm1",role="frontend"}'
        values: '0x30'
      - series: 'up{job="vm1-nginx",instance="vm1",role="frontend"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: NginxDown
        exp_alerts: []
      - eval_time: 6m
        alertname: NginxDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: nginx
              job: vm1-nginx
              instance: vm1
              role: frontend
            exp_annotations:
              summary: 'VM1 nginx exporter가 5분 넘게 stub_status를 읽지 못한다'
              description: 'nginx가 중단되었거나 stub_status endpoint가 닫힌 상태다. 앞의 경우라면 공개 도메인 접속이 전부 실패한다.'
              action: 'VM1에서 curl -s http://127.0.0.1:8080/stub_status 로 endpoint를 확인하고, journalctl -u bngdrasil-nginx-exporter -n 50 으로 exporter 쪽 오류를 읽는다.'
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts: []

  # nginx가 정상이면 발화하지 않는다.
  - interval: 30s
    input_series:
      - series: 'nginx_up{job="vm1-nginx",instance="vm1",role="frontend"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: NginxDown
        exp_alerts: []

  # exporter를 아직 설치하지 않아 두 시계열이 전혀 없는 상황이다. 규칙은 평가
  # 결과가 비어 있어야 하며, file_sd의 대상 파일도 없으므로 TargetDown도 울리지
  # 않는다. 설치 전까지 경보가 늘어나지 않는다는 점을 확인한다.
  - interval: 30s
    input_series:
      - series: 'up{job="prometheus",instance="localhost:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 10m
        alertname: NginxDown
        exp_alerts: []
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts: []
