# 최소 alert rule 모음
#
# 통지 경로는 Grafana alerting이다. Alertmanager는 이번 범위에서 도입하지 않았으며,
# receiver가 비어 있는 상태로 두면 경보가 아무 곳에도 도달하지 않기 때문이다.
# Grafana에서 이 규칙들의 상태를 조회해 통지 규칙을 연결한다.
#
# job label의 출처
#   prometheus.yml의 msa-services job이 file_sd의 service label을 `msa-<service>`
#   형태로 job에 복사한다. 따라서 Bifrost는 job="msa-gateway", Bidar는
#   job="msa-auth-server"가 된다.
#
# 두 서비스가 같은 metric 이름을 서로 다른 label로 노출한다는 점에 주의해야 한다.
#   Bifrost(직접 계측, bifrost/src/core/metrics.py)
#     http_requests_total{method, service, status_class}   status_class는 "5xx" 형태
#     http_request_duration_seconds{method, service}
#   Bidar(prometheus-fastapi-instrumentator 기본 계측, bidar/src/main.py)
#     http_requests_total{method, status, handler}         status는 "500" 같은 실제 코드
#     http_request_duration_seconds{method, handler}
#     http_requests_inprogress
#   should_group_status_codes=False이므로 Bidar의 status는 묶이지 않은 원래 코드다.
#   하나의 식으로 두 형태를 같이 다루면 label 불일치로 조용히 빈 결과가 나오므로
#   서비스별로 규칙을 나눈다.

groups:
  - name: basic-availability
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} target이 5분 이상 응답하지 않는다'
          description: '{{ $labels.instance }}의 {{ $labels.job }} scrape가 실패하고 있다. 컨테이너 상태와 네트워크를 확인한다.'

  - name: basic-errors
    interval: 30s
    rules:
      # Bifrost는 상태 코드를 status_class로 묶어서 노출한다.
      - alert: GatewayHighServerErrorRate
        expr: |
          sum(rate(http_requests_total{job="msa-gateway",status_class="5xx"}[5m]))
            /
          sum(rate(http_requests_total{job="msa-gateway"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: 'Bifrost 게이트웨이의 5xx 응답 비율이 5%를 넘는다'
          description: '10분 동안 5xx 비율이 기준을 넘었다. 최근 배포와 등록된 서비스의 상태를 확인한다.'

      # 어느 upstream에서 실패가 몰리는지 구분한다. service label은 등록된 서비스
      # 수만큼만 늘어나므로 카디널리티가 제한된다.
      - alert: GatewayUpstreamHighServerErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{job="msa-gateway",status_class="5xx"}[5m]))
            /
          sum by (service) (rate(http_requests_total{job="msa-gateway"}[5m]))
            > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '게이트웨이가 프록시하는 {{ $labels.service }}의 5xx 비율이 10%를 넘는다'
          description: '해당 upstream 서비스의 상태를 먼저 확인한다. service가 gateway이면 게이트웨이 자체 endpoint의 오류다.'

      # Bidar는 instrumentator 기본 계측이라 status가 묶이지 않은 실제 코드다.
      - alert: AuthServerHighServerErrorRate
        expr: |
          sum(rate(http_requests_total{job="msa-auth-server",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="msa-auth-server"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: auth-server
        annotations:
          summary: 'Bidar 인증 서버의 5xx 응답 비율이 5%를 넘는다'
          description: '10분 동안 5xx 비율이 기준을 넘었다. DB 연결과 최근 배포를 확인한다.'

  - name: basic-backup
    interval: 30s
    rules:
      # 백업 job이 node_exporter의 textfile collector로 내보내는 지표다.
      # component label로 로컬 백업과 오프사이트 전송을 구분해서 평가한다. 두 경로는
      # 주기가 다르기 때문에, 하나의 기준으로 묶으면 정상 전송 주기에도 경보가 울린다.
      #
      # 이 시계열이 한 번도 보고된 적이 없으면 규칙 자체가 평가되지 않는다.
      # 따라서 "백업이 도는지"를 이 규칙만으로 판단하지 않는다. textfile collector
      # 경로 설정과 첫 보고 여부는 배포 후에 직접 확인한다.
      #
      # 로컬 백업 주기는 6시간이므로 한 번 걸러도 바로 울리지 않을 만큼의 여유를 두었다.
      - alert: BackupStale
        expr: time() - bngdrasil_backup_last_success_timestamp_seconds{component!="ship"} > 8 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.component }} 백업이 8시간 넘게 성공하지 않았다'
          description: '마지막 성공 이후 {{ $value | humanizeDuration }}이 지났다. 로컬 백업 주기는 6시간이다.'
          action: 'journalctl -u bngdrasil-backup.service -n 200 으로 실패 단계를 확인하고, /var/backups/bngdrasil/state/last-run.json의 failed_steps를 읽는다. 디스크 여유와 PostgreSQL 접속을 확인한 뒤 sudo /opt/bngdrasil-backup/run.sh 를 수동으로 실행한다.'

      # 전송은 백업 직후에 run.sh가 수행하므로 정상 주기는 6시간이다. 여기에 2시간 주기
      # 재시도가 몇 번 실패할 여유를 더해 14시간을 기준으로 삼는다.
      - alert: BackupShipStale
        expr: time() - bngdrasil_backup_last_success_timestamp_seconds{component="ship"} > 14 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 백업 오프사이트 전송이 14시간 넘게 성공하지 않았다'
          description: '마지막 전송 성공 이후 {{ $value | humanizeDuration }}이 지났다. 로컬 백업이 정상이어도 호스트를 잃으면 복구할 사본이 없다.'
          action: 'journalctl -u bngdrasil-backup-ship.service -n 200 으로 원인을 확인한다. VM2를 경유하는 SSH 연결, /etc/bngdrasil-backup/ssh/ 아래 키 권한, VM4의 보관 디렉터리 여유 공간을 차례로 점검한 뒤 sudo /opt/bngdrasil-backup/ship.sh 를 수동으로 실행한다.'

      # 전송하지 못한 성공본이 쌓이면 보존 정책이 그 성공본을 지우지 않으므로 디스크가
      # 계속 찬다. 6시간 주기에서 4개는 24시간분에 해당한다.
      - alert: BackupUnshippedPileup
        expr: bngdrasil_backup_unshipped_total > 4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.component }} 미전송 백업이 {{ $value }}개 쌓였다'
          description: '전송에 성공하지 못한 백업은 보존 정책이 삭제하지 않는다. 그대로 두면 백업 파티션이 찬다.'
          action: 'BackupShipStale과 같은 절차로 전송 경로를 복구한다. 전송이 다시 성공하면 다음 retention 실행에서 세대 정책대로 정리된다. RETENTION_MAX_UNSHIPPED(기본 8)를 넘으면 retention.sh가 exit 1로 끝나고 알림을 보낸다.'

      # 백업이 쌓이는 파티션의 여유 공간을 절대 크기로 본다. /var/backups를 별도
      # 파티션으로 분리하면 그 mountpoint가 자동으로 선택된다.
      - alert: BackupDiskLow
        expr: |
          min by (instance) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint=~"/|/var|/var/backups"}
          ) < 10 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 백업 파티션 여유 공간이 10GiB 미만이다'
          description: '여유 공간이 {{ $value | humanize1024 }}B까지 줄었다. 백업 스크립트는 여유가 부족하면 덤프를 시작하지 않고 실패한다.'
          action: 'du -sh /var/backups/bngdrasil/* 로 어느 구성 요소가 공간을 차지하는지 확인한다. 미전송 백업이 원인이면 전송 경로를 먼저 복구하고, 그렇지 않으면 RETENTION_DAILY 값을 조정한 뒤 sudo /opt/bngdrasil-backup/retention.sh --dry-run 으로 삭제 대상을 확인한다.'

  - name: basic-capacity
    interval: 30s
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.mountpoint }} 여유 공간이 15% 미만이다'
          description: '로그, Docker 이미지, 백업 파일이 쌓였는지 확인한다.'

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.mountpoint }} 여유 공간이 5% 미만이다'
          description: 'DB 쓰기 실패가 발생할 수 있다. 즉시 공간을 확보한다.'
