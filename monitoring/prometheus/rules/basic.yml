# 최소 alert rule 모음
#
# 규칙의 단일 출처는 이 파일이다. Grafana의 contact point는 Grafana가 직접
# 관리하는 규칙만 통지하고 Prometheus의 rule_files 규칙은 통지하지 못하므로,
# 규칙을 이 파일 하나에 모아 두려면 통지는 Alertmanager가 맡아야 한다.
#
# 그래서 Alertmanager 설정(monitoring/alertmanager/alertmanager.yml)과 compose
# 서비스를 미리 준비해 두되, Discord webhook URL을 아직 발급받지 않았으므로
# `profiles: ["alerting"]`으로 기본 기동에서 제외했다. "receiver가 비어 있는
# Alertmanager를 두지 않는다"는 기존 결정은 그대로 유지된다. 도달하지 못하는
# 통지 경로가 켜져 있는 시점이 없기 때문이다.
# 활성화 절차는 monitoring/README.md의 "통지 경로" 항목에 있다.
#
# job label의 출처
#   prometheus.yml의 msa-services job이 file_sd의 service label을 `msa-<service>`
#   형태로 job에 복사한다. 따라서 Bifrost는 job="msa-gateway", Bidar는
#   job="msa-auth-server"가 된다.
#
# 두 서비스가 같은 metric 이름을 서로 다른 label로 노출한다는 점에 주의해야 한다.
#   Bifrost(직접 계측, bifrost/src/core/metrics.py)
#     http_requests_total{method, service, status_class}   status_class는 "5xx" 형태
#     http_request_duration_seconds{method, service}
#   Bidar(prometheus-fastapi-instrumentator 기본 계측, bidar/src/main.py)
#     http_requests_total{method, status, handler}         status는 "500" 같은 실제 코드
#     http_request_duration_seconds{method, handler}
#     http_requests_inprogress
#   should_group_status_codes=False이므로 Bidar의 status는 묶이지 않은 원래 코드다.
#   하나의 식으로 두 형태를 같이 다루면 label 불일치로 조용히 빈 결과가 나오므로
#   서비스별로 규칙을 나눈다.

groups:
  - name: basic-availability
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} target이 5분 이상 응답하지 않는다'
          description: '{{ $labels.instance }}의 {{ $labels.job }} scrape가 실패하고 있다. 컨테이너 상태와 네트워크를 확인한다.'

  - name: basic-errors
    interval: 30s
    rules:
      # Bifrost는 상태 코드를 status_class로 묶어서 노출한다.
      - alert: GatewayHighServerErrorRate
        expr: |
          sum(rate(http_requests_total{job="msa-gateway",status_class="5xx"}[5m]))
            /
          sum(rate(http_requests_total{job="msa-gateway"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: 'Bifrost 게이트웨이의 5xx 응답 비율이 5%를 넘는다'
          description: '10분 동안 5xx 비율이 기준을 넘었다. 최근 배포와 등록된 서비스의 상태를 확인한다.'

      # 어느 upstream에서 실패가 몰리는지 구분한다. service label은 등록된 서비스
      # 수만큼만 늘어나므로 카디널리티가 제한된다.
      - alert: GatewayUpstreamHighServerErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{job="msa-gateway",status_class="5xx"}[5m]))
            /
          sum by (service) (rate(http_requests_total{job="msa-gateway"}[5m]))
            > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '게이트웨이가 프록시하는 {{ $labels.service }}의 5xx 비율이 10%를 넘는다'
          description: '해당 upstream 서비스의 상태를 먼저 확인한다. service가 gateway이면 게이트웨이 자체 endpoint의 오류다.'

      # Bidar는 instrumentator 기본 계측이라 status가 묶이지 않은 실제 코드다.
      - alert: AuthServerHighServerErrorRate
        expr: |
          sum(rate(http_requests_total{job="msa-auth-server",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="msa-auth-server"}[5m]))
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: auth-server
        annotations:
          summary: 'Bidar 인증 서버의 5xx 응답 비율이 5%를 넘는다'
          description: '10분 동안 5xx 비율이 기준을 넘었다. DB 연결과 최근 배포를 확인한다.'

  - name: basic-backup
    interval: 30s
    rules:
      # 백업 job이 node_exporter의 textfile collector로 내보내는 지표다.
      # component label로 로컬 백업과 오프사이트 전송을 구분해서 평가한다. 두 경로는
      # 주기가 다르기 때문에, 하나의 기준으로 묶으면 정상 전송 주기에도 경보가 울린다.
      #
      # 이 시계열이 한 번도 보고된 적이 없으면 규칙 자체가 평가되지 않는다.
      # 따라서 "백업이 도는지"를 이 규칙만으로 판단하지 않는다. textfile collector
      # 경로 설정과 첫 보고 여부는 배포 후에 직접 확인한다.
      #
      # 로컬 백업 주기는 6시간이므로 한 번 걸러도 바로 울리지 않을 만큼의 여유를 두었다.
      - alert: BackupStale
        expr: time() - bngdrasil_backup_last_success_timestamp_seconds{component!="ship"} > 8 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.component }} 백업이 8시간 넘게 성공하지 않았다'
          description: '마지막 성공 이후 {{ $value | humanizeDuration }}이 지났다. 로컬 백업 주기는 6시간이다.'
          action: 'journalctl -u bngdrasil-backup.service -n 200 으로 실패 단계를 확인하고, /var/backups/bngdrasil/state/last-run.json의 failed_steps를 읽는다. 디스크 여유와 PostgreSQL 접속을 확인한 뒤 sudo /opt/bngdrasil-backup/run.sh 를 수동으로 실행한다.'

      # 전송은 백업 직후에 run.sh가 수행하므로 정상 주기는 6시간이다. 여기에 2시간 주기
      # 재시도가 몇 번 실패할 여유를 더해 14시간을 기준으로 삼는다.
      - alert: BackupShipStale
        expr: time() - bngdrasil_backup_last_success_timestamp_seconds{component="ship"} > 14 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 백업 오프사이트 전송이 14시간 넘게 성공하지 않았다'
          description: '마지막 전송 성공 이후 {{ $value | humanizeDuration }}이 지났다. 로컬 백업이 정상이어도 호스트를 잃으면 복구할 사본이 없다.'
          action: 'journalctl -u bngdrasil-backup-ship.service -n 200 으로 원인을 확인한다. VM2를 경유하는 SSH 연결, /etc/bngdrasil-backup/ssh/ 아래 키 권한, VM4의 보관 디렉터리 여유 공간을 차례로 점검한 뒤 sudo /opt/bngdrasil-backup/ship.sh 를 수동으로 실행한다.'

      # 전송하지 못한 성공본이 쌓이면 보존 정책이 그 성공본을 지우지 않으므로 디스크가
      # 계속 찬다. 6시간 주기에서 4개는 24시간분에 해당한다.
      - alert: BackupUnshippedPileup
        expr: bngdrasil_backup_unshipped_total > 4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.component }} 미전송 백업이 {{ $value }}개 쌓였다'
          description: '전송에 성공하지 못한 백업은 보존 정책이 삭제하지 않는다. 그대로 두면 백업 파티션이 찬다.'
          action: 'BackupShipStale과 같은 절차로 전송 경로를 복구한다. 전송이 다시 성공하면 다음 retention 실행에서 세대 정책대로 정리된다. RETENTION_MAX_UNSHIPPED(기본 8)를 넘으면 retention.sh가 exit 1로 끝나고 알림을 보낸다.'

      # 백업이 쌓이는 파티션의 여유 공간을 절대 크기로 본다. /var/backups를 별도
      # 파티션으로 분리하면 그 mountpoint가 자동으로 선택된다.
      - alert: BackupDiskLow
        expr: |
          min by (instance) (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint=~"/|/var|/var/backups"}
          ) < 10 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 백업 파티션 여유 공간이 10GiB 미만이다'
          description: '여유 공간이 {{ $value | humanize1024 }}B까지 줄었다. 백업 스크립트는 여유가 부족하면 덤프를 시작하지 않고 실패한다.'
          action: 'du -sh /var/backups/bngdrasil/* 로 어느 구성 요소가 공간을 차지하는지 확인한다. 미전송 백업이 원인이면 전송 경로를 먼저 복구하고, 그렇지 않으면 RETENTION_DAILY 값을 조정한 뒤 sudo /opt/bngdrasil-backup/retention.sh --dry-run 으로 삭제 대상을 확인한다.'

  - name: basic-blackbox
    interval: 30s
    rules:
      # blackbox exporter의 HTTP probe 결과다. probe_success는 up과 다른
      # 지표이므로 TargetDown 규칙으로는 probe 실패를 잡을 수 없다.
      #
      # 이 그룹은 두 job을 본다. OriginEndpointDown과 두 인증서 규칙은
      # job="blackbox-http-origin"을, GatewayNotReady와 InternalEndpointDown은
      # job="blackbox-http-internal"을 본다. 앞의 job은 VM2에서 VM1(10.0.1.133)에
      # 직접 붙고 Host 헤더와 SNI만 공개 도메인으로 맞춘 probe이고, 뒤의 job은
      # api-network 안의 컨테이너에 곧바로 붙는 probe다.
      #
      # Cloudflare를 거치는 job="blackbox-http-external"에는 어떤 경보도 붙이지
      # 않는다. Cloudflare가 요청을 봇으로 판단하면 챌린지 403을 돌려주고, 그것은
      # 오리진이 멀쩡한데도 probe_success가 0이 된다는 뜻이다. 2026-09-19에 GitHub
      # 러너가 실제로 그 403을 받았다. 그 job의 시계열은 대시보드에서 두 경로의
      # 결과를 비교하는 용도로만 쓰며, 경보 연결 여부는 VM2에서 실제 결과를 얼마간
      # 모아 본 뒤에 다시 판단한다.
      #
      # 이 probe는 VM2 안에서 실행된다. 따라서 VM2 자체가 죽으면 probe도 함께
      # 멈추고 이 규칙은 울리지 않는다. VM2 장애는 VM2 밖의 독립된 probe로만
      # 감지할 수 있으며, 그 구성은 아직 남은 과제다.
      - alert: OriginEndpointDown
        expr: probe_success{job="blackbox-http-origin"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '오리진 endpoint {{ $labels.instance }}가 5분 넘게 2xx를 돌려주지 않는다'
          description: 'VM1 Nginx와 그 뒤의 VM2 애플리케이션 가운데 어디에서 끊겼는지 확인한다. instance는 표시용 공개 URL이며 probe는 Cloudflare를 거치지 않고 10.0.1.133에 직접 붙는다.'
          action: 'VM2에서 sudo docker compose -f docker-compose.monitoring.yml exec blackbox-exporter wget -qO- "http://localhost:9115/probe?module=http_2xx_origin&target=https://10.0.1.133<경로>&hostname=<도메인>&debug=true" 를 실행해 실패 단계를 읽는다. 경로와 도메인은 instance의 것을 그대로 쓴다. 내부 probe가 정상이면 VM1 Nginx를 확인한다.'

      # Bifrost의 /ready는 DB 연결과 서비스 등록부를 함께 확인하고, 준비되지
      # 않으면 503을 돌려준다. 컨테이너가 살아 있어도 프록시가 동작하지 못하는
      # 상태를 이 규칙이 잡는다.
      - alert: GatewayNotReady
        expr: probe_success{job="blackbox-http-internal",instance="http://gateway:8000/ready"} == 0
        for: 3m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: 'Bifrost 게이트웨이의 /ready가 3분 넘게 준비 상태를 보고하지 않는다'
          description: '컨테이너가 실행 중이어도 DB 연결이나 서비스 등록부가 준비되지 않으면 프록시가 동작하지 못한다.'
          action: 'sudo docker logs vm2-gateway --tail 200 으로 원인을 확인하고, VM3 PostgreSQL 접속과 services 테이블을 점검한다.'

      # 내부 probe 가운데 gateway readiness 말고 나머지를 한 규칙으로 묶는다.
      # 두 규칙의 조건이 겹치면 같은 장애로 경보가 두 번 오므로 instance로 나눈다.
      - alert: InternalEndpointDown
        expr: probe_success{job="blackbox-http-internal",instance!="http://gateway:8000/ready"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '내부 endpoint {{ $labels.instance }}가 5분 넘게 2xx를 돌려주지 않는다'
          description: '해당 컨테이너의 상태와 api-network 연결을 확인한다.'

      # 인증서 만료는 갱신할 시간이 필요하므로 두 단계로 나눈다. 21일은 갱신
      # 일정을 잡을 여유이고, 7일은 즉시 대응해야 하는 시점이다. warning 쪽의
      # 조건에 하한을 붙여서 두 단계가 동시에 울리지 않게 했다.
      #
      # 두 규칙 모두 job="blackbox-http-origin"으로 대상을 한정한다.
      #
      # 이 지표는 이제 VM1이 들고 있는 origin 인증서(/etc/ssl/cloudflare/cert.pem)의
      # 만료 시각이다. probe가 Cloudflare를 거치지 않고 VM1에 직접 붙기 때문이다.
      # 갱신 주체도 Cloudflare 자동 갱신이 아니라 사람이며, Origin CA 인증서는
      # 발급할 때 정한 기간(기본 15년)이 지나면 새로 발급해 VM1에 올려야 한다.
      #
      # job selector가 없으면 Cloudflare 경유 job의 edge 인증서 만료까지 함께
      # 걸린다. edge 인증서는 Cloudflare가 자동으로 갱신하므로 우리가 대응할 일이
      # 없고, 갱신 직전 구간마다 손댈 수 없는 경보가 울린다.
      - alert: TLSCertExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry{job="blackbox-http-origin"} - time()) < 21 * 24 * 3600
          and
          (probe_ssl_earliest_cert_expiry{job="blackbox-http-origin"} - time()) >= 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 origin TLS 인증서가 21일 안에 만료된다'
          description: '남은 기간은 {{ $value | humanizeDuration }}이다. VM1이 들고 있는 Cloudflare Origin CA 인증서의 만료 시각이다.'
          action: 'Cloudflare 대시보드의 SSL/TLS > Origin Server에서 origin 인증서를 다시 발급하고, VM1의 /etc/ssl/cloudflare/cert.pem과 key.pem을 교체한 뒤 nginx -s reload 한다.'

      - alert: TLSCertExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http-origin"} - time()) < 7 * 24 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 origin TLS 인증서가 7일 안에 만료된다'
          description: '남은 기간은 {{ $value | humanizeDuration }}이다. 만료되면 Cloudflare가 오리진에 접속하지 못해 해당 도메인이 전부 실패한다.'
          action: 'TLSCertExpiringSoon과 같은 절차를 즉시 수행한다.'

  - name: basic-containers
    interval: 30s
    rules:
      # cAdvisor에는 재시작 횟수를 직접 세는 지표가 없다.
      #
      # 이전 판은 container_start_time_seconds 값이 재시작마다 바뀐다고 보고
      # changes()로 세었으나, 실제로 측정해 보니 그 값은 바뀌지 않는다.
      # gcr.io/cadvisor/cadvisor:v0.52.1로 더미 컨테이너를 다섯 번 restart하는
      # 동안 docker inspect의 StartedAt은 매번 앞으로 갔지만 이 지표는 최초
      # 생성 시각에 고정되어 있었고, changes(...[15m])은 0이었다.
      #
      # 대신 컨테이너를 다시 시작하면 cgroup이 새로 만들어지면서 누적 카운터가
      # 0으로 돌아간다. 같은 시험에서 resets(container_cpu_usage_seconds_total[15m])은
      # 실제 재시작 횟수와 같은 5를 돌려주었다. 그래서 이 카운터의 reset 횟수로
      # 재시작 반복을 판단한다. 15분 동안 3번을 넘으면 restart 정책이 계속 실패를
      # 되돌리고 있다는 뜻이다.
      #
      # 한계: 기동하자마자 죽는 컨테이너는 cAdvisor의 housekeeping 주기(운영 설정은
      # 30s) 안에 한 번도 표본이 잡히지 않아 시계열 자체가 만들어지지 않는다. 같은
      # 시험에서 즉시 종료하는 crash loop 컨테이너는 어떤 cAdvisor 시계열도 남기지
      # 않았다. 그 구간은 이 규칙으로 볼 수 없고, scrape 대상인 서비스라면
      # TargetDown이 대신 잡는다.
      - alert: ContainerRestartLoop
        expr: resets(container_cpu_usage_seconds_total{name!=""}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '컨테이너 {{ $labels.name }}이 15분 동안 세 번 넘게 다시 시작되었다'
          description: 'restart 정책이 실패를 계속 되돌리고 있으므로, 컨테이너 목록만 보아서는 정상으로 보인다.'
          action: 'sudo docker logs {{ $labels.name }} --tail 200 으로 기동 실패 원인을 확인한다. 환경 변수 누락과 의존 서비스 연결을 먼저 본다.'

      # 메모리 한도를 지정하지 않은 컨테이너는 container_spec_memory_limit_bytes가
      # 0으로 나오므로 분모 조건으로 걸러 낸다. 현재 VM2의 컨테이너에는 한도가
      # 지정되어 있지 않아서, 한도를 붙이기 전까지 이 규칙은 평가 결과가 비어 있다.
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            /
          container_spec_memory_limit_bytes{name!=""}
            > 0.90
          and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '컨테이너 {{ $labels.name }}의 메모리 사용량이 한도의 90%를 넘었다'
          description: '이 상태가 이어지면 커널이 컨테이너를 OOM으로 종료한다.'
          action: 'sudo docker stats --no-stream 으로 현재 사용량을 확인하고, 누수인지 정상적인 증가인지 판단한 뒤 한도를 조정하거나 애플리케이션을 고친다.'

  - name: basic-remote-exporters
    interval: 30s
    rules:
      # VM1과 VM3의 원격 exporter가 대상에 접속하지 못하는 상태를 잡는다.
      #
      # up과 무엇이 다른가
      #   up은 Prometheus가 exporter의 /metrics를 긁는 데 성공했는지만 말해 준다.
      #   exporter는 떠 있는데 그 뒤의 PostgreSQL이나 nginx stub_status에 접속하지
      #   못하는 상황에서는 up이 1이고 pg_up 또는 nginx_up이 0이 된다. 그 구간을
      #   TargetDown으로는 볼 수 없으므로 규칙을 따로 둔다.
      #
      # 지표 이름은 고정한 exporter 버전에서 실제로 노출하는 것만 사용한다.
      # postgres_exporter 0.20.1은 pg_up을, nginx-prometheus-exporter 1.5.3은
      # nginx_up을 내보낸다.
      #
      # exporter를 설치하기 전에는 두 시계열이 아예 없으므로 이 규칙은 평가
      # 결과가 비어 있고 발화하지 않는다. 따라서 수집이 끊긴 것과 아직 설치하지
      # 않은 것을 이 규칙으로 구분할 수 없으며, 수집 여부 자체는 target 상태로
      # 확인한다.
      - alert: PostgresDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: 'VM3 PostgreSQL exporter가 5분 넘게 데이터베이스에 접속하지 못한다'
          description: 'exporter 프로세스는 살아 있으나 접속에 실패하고 있다. 데이터베이스 중단이거나 인증 정보가 어긋난 상태다. 이 경보는 5432번 포트의 17 클러스터만 대상으로 한다.'
          action: 'VM3에서 journalctl -u bngdrasil-postgres-exporter -n 50 으로 접속 오류를 확인하고, systemctl status postgresql 과 /etc/bngdrasil-exporters/postgres-exporter.env 의 접속 문자열을 점검한다.'

      - alert: NginxDown
        expr: nginx_up == 0
        for: 5m
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: 'VM1 nginx exporter가 5분 넘게 stub_status를 읽지 못한다'
          description: 'nginx가 중단되었거나 stub_status endpoint가 닫힌 상태다. 앞의 경우라면 공개 도메인 접속이 전부 실패한다.'
          action: 'VM1에서 curl -s http://127.0.0.1:8080/stub_status 로 endpoint를 확인하고, journalctl -u bngdrasil-nginx-exporter -n 50 으로 exporter 쪽 오류를 읽는다.'

  - name: basic-logging
    interval: 30s
    rules:
      # 로그 수집 경로는 Alloy와 Loki 두 곳에서 관찰한다. 두 곳의 계수 단위가
      # 다르다는 점이 이 그룹의 규칙을 가르는 기준이다.
      #
      # Alloy 쪽(job="alloy")
      #   loki_write_dropped_entries_total{component_id, host, reason, tenant}
      #   loki_write_request_duration_seconds_count{component_id, host, status_code, tenant}
      #   loki_process_dropped_lines_total{component_id, reason}
      #   앞의 두 지표는 배치 단위로 늘어난다. Loki가 한 요청 안의 오래된 줄만
      #   거절하고 나머지를 정상으로 적재해도, Alloy는 그 요청에 실려 있던 줄을
      #   전부 버린 것으로 센다. 2026-09-28 VM2에서 실제 400 응답 8건에
      #   loki_write_dropped_entries_total{reason="ingester_error"}가 23,840 늘어난
      #   것이 그 때문이다. 이 값을 잃은 줄 수로 읽으면 안 된다.
      #
      # Loki 쪽(job="loki")
      #   loki_discarded_samples_total{policy, reason, retention_hours, tenant}
      #   loki_discarded_bytes_total{policy, reason, retention_hours, tenant}
      #   이쪽은 줄 단위다. distributor와 ingester가 거절한 항목을 하나씩 센다.
      #   prometheus.yml에 loki job을 추가해서 이 지표를 수집한다.
      #
      # reason 값은 grafana/loki:3.5.7을 실제로 띄워서 각 상황을 만들어 확인했다.
      # 문서에서 옮겨 적은 것이 아니다.
      #   too_far_behind             정렬 창(max_chunk_age의 절반, 운영 설정에서 30분)
      #                              보다 뒤처진 줄. HTTP 400.
      #   greater_than_max_sample_age  reject_old_samples_max_age(168h)를 넘긴 줄. HTTP 400.
      #   line_too_long              max_line_size를 넘긴 줄. HTTP 400.
      #   rate_limited               ingestion_rate_mb 초과. HTTP 429.
      #   per_stream_rate_limit      per_stream_rate_limit 초과. HTTP 429.
      #   stream_limit               max_streams_per_user 초과. HTTP 429.
      #
      # 앞의 두 reason은 "순서와 나이" 때문에 거절된 것이고 나머지는 "Loki가
      # 지금 새 로그를 받지 못한다"는 뜻이다. 이 구분이 아래 두 규칙을 가른다.
      #
      # Alloy 프로세스 자체가 죽거나 컨테이너가 사라진 경우는 여기에 규칙을 따로
      # 두지 않는다. prometheus.yml에 alloy job과 loki job이 있으므로
      # basic-availability의 TargetDown이 up == 0으로 그 상태를 이미 잡는다.
      #
      # 네 규칙 모두 pipeline="logs" label을 붙인다. Alertmanager의 억제 규칙이
      # Alloy 쪽 경보와 Loki 쪽 경보를 하나의 전송 경로로 묶을 때 쓰는 label이며,
      # 근거는 alertmanager.yml의 해당 규칙 주석에 적었다.

      - alert: LogShippingDropping
        # Alloy가 스스로 버린 줄이다. reason에서 ingester_error를 뺀다.
        #
        # 남는 reason은 rate_limited, stream_limited, line_too_long,
        # queue_is_full이다. 이들은 Alloy가 응답 본문이나 제 큐 상태를 보고
        # 붙이는 값이라서, 값이 늘었다면 보낼 수 있었어야 하는 줄을 실제로
        # 잃었다는 뜻이 분명하다. 그래서 critical로 둔다.
        #
        # ingester_error를 제외하는 이유는 그 값이 두 가지를 섞어 담기 때문이다.
        # Alloy의 loki.write는 재시도할 수 없는 4xx를 받거나 재시도를 소진했을 때
        # 이 reason으로 센다. 2026-09-27~28 VM2 실사에서 확인한 실제 동작은 이렇다.
        # 배포 때문에 Alloy를 재시작하면 loki.source.docker가 각 컨테이너의 저장된
        # 위치부터 다시 읽어서 이미 적재된 줄을 다시 보낸다. 그 가운데 Loki의
        # 정렬 창을 넘긴 줄과, stage.drop의 167h 경계에 걸리지 않는 7일 미만의
        # 오래된 줄이 400으로 거절된다. Alloy는 그 배치 전체를 버린 것으로 세므로
        # 카운터가 크게 뛴다. 그러나 그 줄들은 Alloy가 끊김 없이 돌았다면 이미
        # 적재되어 있는 것이고 유실이 아니다. 배포마다 이 경보가 약 10분 동안
        # critical로 울렸고, 그 반복이 나머지 경보의 신뢰도까지 깎았다.
        #
        # 제외의 대가: Loki가 5xx를 계속 돌려주어 Alloy가 재시도를 소진하는 경우도
        # ingester_error로 세어지므로 이 규칙이 그 구간을 잡지 않는다. 그 구간은
        # 아래 LogShippingWriteFailing이 5xx를 직접 보아서 잡고, Loki 컨테이너가
        # 함께 무너졌다면 TargetDown{job="loki"}가 잡는다.
        #
        # rate와 for를 함께 쓰지 않는다. rate(...[10m]) > 0에 긴 for를 붙이면
        # 한 번에 크게 버리고 멈추는 유실은 영영 발화하지 않는다. rate의 창이
        # 지나가면 식이 0으로 돌아가서 for를 채울 수 없기 때문이다. increase로
        # 두고 for를 없애면 한 번 늘어난 뒤 멈추어도 창이 지나갈 때까지 발화한다.
        expr: sum by (reason) (increase(loki_write_dropped_entries_total{job="alloy",reason!="ingester_error"}[10m])) > 0
        labels:
          severity: critical
          service: alloy
          pipeline: logs
        annotations:
          summary: 'Alloy가 Loki로 보내지 못한 로그를 버렸다 (reason={{ $labels.reason }})'
          description: '최근 10분 안에 Alloy가 스스로 버린 로그 줄이 있다. 이 reason은 재전송 때문에 생기는 순서와 나이 거부를 이미 제외했으므로, 이 구간의 로그는 실제로 사라졌다. 값은 배치 단위이므로 잃은 줄 수와 같지 않다. 정확한 줄 수는 Loki 쪽 지표로 읽는다.'
          action: '1) reason이 rate_limited나 stream_limited이면 Loki의 수용 한도 문제다. sudo docker exec vm2-prometheus wget -q -O- http://loki:3100/metrics | grep loki_discarded_samples_total 으로 줄 단위 거절 수를 확인한 뒤 monitoring/loki/loki-config.yml의 limits_config를 올린다. 2) line_too_long이면 특정 컨테이너가 한 줄에 너무 긴 로그를 찍고 있다. 그 컨테이너를 찾아 로그 형식을 고친다. 3) queue_is_full이면 Loki가 느리거나 멈춘 것이다. curl -s http://127.0.0.1:3100/ready 와 sudo docker logs vm2-loki --tail 100 을 본다. 4) 어느 경우든 sudo docker logs vm2-alloy --tail 100 으로 Alloy가 받은 응답 본문을 함께 읽는다.'

      - alert: LokiRejectingEntries
        # Loki가 줄 단위로 거절한 것 가운데 순서와 나이 이유를 제외한 나머지다.
        # 남는 reason은 rate_limited, per_stream_rate_limit, stream_limit,
        # line_too_long이며, 모두 "Loki가 지금 새 로그를 받지 못한다"는 뜻이다.
        #
        # severity를 critical로 두는 근거
        #   이 reason으로 거절된 줄은 다시 보내도 같은 이유로 다시 거절된다.
        #   rate_limited와 per_stream_rate_limit은 429라서 Alloy가 재시도하지만,
        #   유입량이 한도를 넘어서 생긴 거절이므로 재시도는 큐를 더 채울 뿐이고
        #   결국 Alloy 쪽 드롭으로 넘어간다. line_too_long과 stream_limit은 그
        #   자리에서 끝난다. 그리고 이 지표는 줄 단위라서 얼마나 잃었는지를
        #   정확히 말해 준다. 배치 단위인 Alloy 쪽 지표보다 판단 근거가 분명하므로
        #   LogShippingDropping과 같은 등급으로 둔다.
        #
        # LogShippingDropping과 함께 울릴 수 있고, 그대로 둔다. 두 경보는 같은
        # 사건을 서로 다른 단위로 말한다. Loki가 거절한 줄 수와 Alloy가 포기한
        # 배치 수는 대응할 때 둘 다 필요하다.
        #
        # for를 두지 않는 이유는 LogShippingDropping과 같다.
        expr: sum by (reason) (increase(loki_discarded_samples_total{job="loki",reason!~"too_far_behind|greater_than_max_sample_age"}[10m])) > 0
        labels:
          severity: critical
          service: loki
          pipeline: logs
        annotations:
          summary: 'Loki가 새 로그 줄을 거절하고 있다 (reason={{ $labels.reason }})'
          description: '최근 10분 안에 Loki가 줄 단위로 {{ $value | humanize }}개를 거절했다. 재시작 직후의 재전송에서 생기는 순서와 나이 거부는 제외한 값이므로, 지금 들어오는 로그가 실제로 적재되지 못하고 있다.'
          action: '1) sudo docker exec vm2-prometheus wget -q -O- http://loki:3100/metrics | grep -E "loki_discarded_(samples|bytes)_total" 으로 reason별 줄 수와 바이트 수를 읽는다. 2) rate_limited나 per_stream_rate_limit이면 monitoring/loki/loki-config.yml의 ingestion_rate_mb, ingestion_burst_size_mb, per_stream_rate_limit을 올린다. 유입이 갑자기 늘어난 것이라면 어느 컨테이너가 쏟아내는지 Grafana의 bngdrasil-logs 대시보드에서 먼저 찾는다. 3) stream_limit이면 label 조합이 폭발한 것이다. monitoring/alloy/config.alloy의 discovery.relabel.docker_logs가 만드는 label을 확인한다. 4) line_too_long이면 해당 컨테이너의 로그 형식을 고친다.'

      - alert: LokiRejectingStaleEntries
        # 순서와 나이 때문에 거절된 줄이다. 이 거절 자체는 유실이 아니다.
        #
        # 왜 따로 두는가
        #   Alloy를 재시작하면 loki.source.docker가 저장된 위치부터 다시 읽어서
        #   이미 적재된 줄을 다시 보낸다. Loki의 정렬 창(max_chunk_age의 절반,
        #   운영 설정에서 30분)을 넘긴 줄은 too_far_behind로, 168시간을 넘긴 줄은
        #   greater_than_max_sample_age로 거절된다. 두 경우 모두 그 줄은 Alloy가
        #   끊김 없이 돌았다면 이미 Loki에 있다. 그래서 배포 직후의 한 번짜리
        #   몰림에는 아무 경보도 울리지 않아야 한다.
        #
        #   그러나 이 거절이 계속 늘어난다면 이야기가 다르다. Alloy가 같은 구간을
        #   반복해서 다시 읽고 있거나, 호스트 시계가 어긋났거나, 어떤 컨테이너가
        #   과거 시각이 찍힌 줄을 계속 만들어 내고 있다는 뜻이다. 그 상태에서는
        #   전송 대역과 Loki의 처리 시간이 계속 낭비된다.
        #
        # 두 겹으로 조용하게 만든다.
        #   1. unless 절이 Alloy 기동 후 900초 동안 이 규칙을 아예 비활성으로 둔다.
        #      process_start_time_seconds는 Alloy가 Go 런타임 기본 수집기로
        #      내보내는 값이며 v1.19.2에서 실제로 나오는 것을 확인했다.
        #      max()로 묶어서 결과의 label을 모두 없앤 뒤 unless on ()으로 결합한다.
        #      이 label 정리를 하지 않으면 양쪽의 label 묶음이 달라 결합이 되지 않는다.
        #   2. for를 30분 둔다. 재시작 몰림은 몇 분 안에 끝나고 increase의 10분 창을
        #      벗어나므로, 900초가 지난 시점에는 식이 이미 0으로 돌아가 있다.
        #      따라서 이 경보가 울리려면 재시작 15분 뒤부터 다시 30분 동안 거절이
        #      끊기지 않아야 한다. 가장 이른 발화 시점은 재시작 45분 뒤다.
        #
        # severity를 warning으로 두는 근거
        #   이 상태로는 로그를 잃지 않는다. 잃는 것은 대역과 처리 시간이고,
        #   고치는 일도 급하지 않다. 다만 방치하면 진짜 거절이 이 잡음에 묻히므로
        #   info로 흘려보내지 않고 사람이 보는 등급에 둔다.
        expr: |
          (
            sum by (reason) (
              increase(loki_discarded_samples_total{job="loki",reason=~"too_far_behind|greater_than_max_sample_age"}[10m])
            ) > 0
          )
          unless on ()
          (
            time() - max(process_start_time_seconds{job="alloy"}) < 900
          )
        for: 30m
        labels:
          severity: warning
          service: loki
          pipeline: logs
        annotations:
          summary: 'Loki가 순서와 나이 때문에 로그 줄을 30분 넘게 계속 거절하고 있다 (reason={{ $labels.reason }})'
          description: '최근 10분 안에 {{ $value | humanize }}개가 거절되었고, 그 상태가 Alloy 재시작 15분 뒤부터 다시 30분 넘게 이어진다. 배포 직후의 한 번짜리 재전송 몰림은 이 조건에 걸리지 않는다. 거절된 줄 자체는 이미 Loki에 있으므로 유실이 아니지만, 계속 늘어난다는 것은 Alloy가 같은 구간을 반복해서 다시 읽고 있거나 시각이 어긋났다는 뜻이다.'
          action: '1) sudo docker logs vm2-alloy --tail 200 | grep -i "too far behind\|too old" 으로 어느 컨테이너의 줄인지 확인한다. 2) sudo docker inspect vm2-alloy | grep -m1 StartedAt 으로 마지막 기동 시각을 보고 재시작이 반복되지 않았는지 확인한다. 반복 재시작이면 그쪽이 원인이다. 3) VM2와 Loki의 시계를 timedatectl 로 확인한다. 4) reason이 greater_than_max_sample_age이면 monitoring/alloy/config.alloy의 loki.process.retention_guard가 167h로 살아 있는지 확인한다. 이 stage가 제 몫을 하면 그 reason은 Loki까지 오지 않는다. 5) reason이 too_far_behind이면 monitoring/loki/loki-config.yml의 ingester.max_chunk_age를 늘려 정렬 창을 넓히는 것이 마지막 수단이다. 창을 넓히면 메모리 사용이 함께 늘어난다.'

      - alert: LogShippingWriteFailing
        # Loki로 가는 요청 자체가 실패하는 구간이다. status_code에서 2xx와 400을 뺀다.
        #
        # 400을 빼는 근거
        #   grafana/loki:3.5.7을 실제로 띄워 확인한 결과, Loki가 400을 돌려주는
        #   경우는 "이 항목을 받아들일 수 없다" 세 가지뿐이다. too_far_behind,
        #   greater_than_max_sample_age, line_too_long이다. 앞의 둘은 재시작 직후의
        #   재전송에서 늘 생기는 잡음이고, line_too_long은 위의 LokiRejectingEntries가
        #   줄 단위로 정확하게 잡는다. 그러므로 400을 여기서 보면 배포마다 이 경보가
        #   같이 울리기만 하고 새로 알려 주는 것이 없다.
        #
        #   4xx 전체를 빼지는 않는다. 429(rate_limited, per_stream_rate_limit,
        #   stream_limit)는 실제 문제이고, 401과 403과 404는 전송 주소나 인증
        #   설정이 어긋났다는 뜻이라서 다른 어떤 규칙도 잡지 않는다. 그 구간을
        #   덮어 버리면 로그가 한 줄도 올라가지 않는데 조용한 상태가 된다.
        #
        # 연결 실패도 이 식에 들어온다. Alloy가 Loki에 접속하지 못한 요청은
        # status_code="-1"로 기록된다. v1.19.2를 띄우고 Loki를 다시 시작하는
        # 동안 실제로 그 값이 나오는 것을 확인했다. 2xx도 400도 아니므로 부정
        # 조건에 그대로 걸린다.
        #
        # for를 5분 두는 이유: 이 단계는 아직 유실이 아니라 재시도 중인 구간이다.
        # increase의 창이 10분이라 한 번의 실패 묶음도 5분 뒤에는 반드시 드러나며,
        # 그만큼 첫 통지가 늦어지는 대신 짧은 흔들림이 곧바로 통지가 되지는 않는다.
        expr: sum by (status_code) (increase(loki_write_request_duration_seconds_count{job="alloy",status_code!~"2..|400"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: alloy
          pipeline: logs
        annotations:
          summary: 'Alloy의 Loki 밀어넣기가 실패하고 있다 (status_code={{ $labels.status_code }})'
          description: '최근 10분 안에 2xx도 400도 아닌 응답이 있었고 그 상태가 5분 넘게 이어진다. 400은 정렬과 나이 때문에 개별 줄이 거절되는 정상 구간이라 제외했으므로, 이 경보는 요청 자체가 처리되지 못한다는 뜻이다. 아직 재시도 중이라면 유실은 없지만 재시도가 소진되면 로그를 잃는다.'
          action: '1) status_code가 5xx이면 Loki 쪽 장애다. curl -s http://127.0.0.1:3100/ready 를 보고 sudo docker logs vm2-loki --tail 100 으로 원인을 읽는다. 이 경우 Alloy의 드롭은 reason=ingester_error로 세어지므로 LogShippingDropping은 울리지 않는다. 유실 여부는 Loki가 정상으로 돌아온 뒤 조회로 확인한다. 2) 429이면 수용 한도 문제이며 LokiRejectingEntries의 절차를 따른다. 3) 401, 403, 404이면 monitoring/alloy/config.alloy의 loki.write endpoint 주소를 확인한다. 4) 2xx도 4xx도 5xx도 아닌 값이면 연결 자체가 안 되는 것이다. sudo docker exec vm2-alloy bash -c "exec 3<>/dev/tcp/loki/3100" 로 api-network 연결을 확인한다.'

      - alert: LogProcessDroppingUnexpected
        # Alloy의 파이프라인이 Loki로 보내기 전에 버린 줄이다. 위의 규칙들이
        # 전송 단계와 Loki 단계를 보는 것과 달리 이 규칙은 그 앞 단계를 본다.
        #
        # 의도한 드롭은 하나뿐이다. alloy/config.alloy의
        # loki.process.retention_guard가 167h를 넘긴 줄을
        # reason="older_than_retention"으로 버리며, 그 값이 늘어나는 것은 정상
        # 동작이므로 여기에서 제외한다. 조용한 컨테이너의 마지막 줄이 5분마다 다시
        # 들어오는 동안에는 그 reason이 계속 늘어나기 때문에, 제외하지 않으면 이
        # 규칙이 상시 발화한다.
        #
        # 그 밖의 reason이 나타나는 경우는 설정이 의도와 달라졌다는 뜻이다.
        # drop_counter_reason을 적지 않은 stage.drop이 들어오면 Alloy의 기본값인
        # reason="drop_stage"로 세어지고, 다른 stage가 줄을 버리면 또 다른 reason이
        # 붙는다. 어느 쪽이든 사람이 설정을 보아야 하는 상황이지만 그 자체로 유실이
        # 확정되지는 않으므로 critical이 아니라 warning으로 둔다.
        expr: sum by (reason) (increase(loki_process_dropped_lines_total{job="alloy",reason!="older_than_retention"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: alloy
          pipeline: logs
        annotations:
          summary: 'Alloy가 예상하지 않은 이유로 로그를 버리고 있다 (reason={{ $labels.reason }})'
          description: '최근 10분 안에 loki.process 단계에서 버린 줄이 있고 그 이유가 보존 기간 초과가 아니다. 설정에 의도하지 않은 드롭이 들어왔을 수 있다.'
          action: 'monitoring/alloy/config.alloy의 loki.process 블록에 retention_guard 말고 다른 stage.drop이 들어왔는지 확인하고, sudo docker exec vm2-prometheus wget -q -O- http://alloy:12345/metrics | grep loki_process_dropped_lines_total 으로 reason별 값을 읽는다.'

  - name: basic-capacity
    interval: 30s
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.mountpoint }} 여유 공간이 15% 미만이다'
          description: '로그, Docker 이미지, 백업 파일이 쌓였는지 확인한다.'

      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
            < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }}의 {{ $labels.mountpoint }} 여유 공간이 5% 미만이다'
          description: 'DB 쓰기 실패가 발생할 수 있다. 즉시 공간을 확보한다.'
