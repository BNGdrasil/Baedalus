server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # OBS-02: /tmp에 두면 컨테이너를 다시 만들 때 위치 기록이 사라져서 같은 로그를
  # 처음부터 다시 읽는다. compose의 promtail_positions volume에 보관한다.
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 컨테이너 로그
  # OBS-02: 이전 판은 파일 경로만 보고 수집했기 때문에 어느 컨테이너의 로그인지
  # 알 수 없었고, README의 조회 예시가 기대하는 service/container label이 없었다.
  # Docker service discovery로 컨테이너 이름과 compose label을 함께 붙인다.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - target_label: 'job'
        replacement: 'docker'
      - target_label: 'host'
        replacement: 'vm2'
    pipeline_stages:
      # compose label이 없는 컨테이너(수동 docker run으로 띄운 wegis_server 등)는
      # service label이 비므로 컨테이너 이름으로 채운다.
      - template:
          source: service
          template: '{{ if .Value }}{{ .Value }}{{ else }}{{ .container }}{{ end }}'
      - labels:
          service:

  # 호스트 시스템 로그
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: vm2
          __path__: /var/log/*log
