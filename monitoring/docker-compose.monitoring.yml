# VM2 모니터링 compose
#
# 운영 배치 위치: /opt/bnbong/docker-compose.monitoring.yml
# compose project: bnbong (working_dir /opt/bnbong)
# 따라서 아래 상대 경로는 모두 /opt/bnbong 기준이며, 이 저장소의 monitoring/
# 디렉터리를 /opt/bnbong/monitoring/으로 전송해야 한다.
#
# 이미지 태그는 2026-09-18에 실제로 실행 중이던 버전으로 고정했다.
# latest 태그는 재시작할 때마다 다른 버전이 뜨므로 사용하지 않는다.
#   prometheus 3.7.2 / grafana 12.2.1 / loki 3.5.7
#
# 뒤에 추가한 blackbox-exporter / cAdvisor / Alertmanager도 같은 이유로 태그를
# 고정한다. VM2는 Ampere 기반 ARM64(VM.Standard.A1.Flex)이므로 세 이미지 모두
# linux/arm64 manifest가 있는 것을 골랐다.
#   blackbox-exporter 0.28.0 / cadvisor 0.52.1 / alertmanager 0.28.1
#
# 로그 수집기는 Promtail에서 Grafana Alloy로 교체했다. Promtail은 2026-03-02에
# 지원이 끝났다. Alloy와 docker-socket-proxy도 같은 기준으로 태그를 고정했고
# 둘 다 linux/arm64 manifest가 있는 것을 docker manifest inspect로 확인했다.
#   alloy 1.19.2 / docker-socket-proxy 0.5.0

services:
  # Prometheus
  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: vm2-prometheus
    ports:
      # SEC-04: VM1 Nginx는 Grafana만 프록시한다. Prometheus는 외부에 게시하지 않는다.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      # 원격 exporter의 file_sd 대상 디렉터리다. 위의 targets mount 안에 들어 있는
      # 경로이므로 수집 자체에는 이 줄이 없어도 되지만, 디렉터리가 없으면
      # Prometheus가 30초마다 아래 오류를 남긴다. 실제로 기동해서 확인한 내용이다.
      #   level=ERROR msg="Error adding file watch" path=/etc/prometheus/targets/remote/
      #   err="no such file or directory"
      #
      # 수집은 정상이고 경보도 울리지 않지만, 로그를 grep해서 원인을 찾는 절차가
      # 이 오류에 계속 걸린다. 배포 워크플로의 rsync는 prometheus/targets/를
      # 제외하므로 저장소에 빈 디렉터리를 두어도 VM2에 전달되지 않는다. 그래서
      # bind mount로 지정해서 Docker가 호스트에 디렉터리를 만들게 한다.
      - ./monitoring/prometheus/targets/remote:/etc/prometheus/targets/remote:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      # 시간 보존과 크기 보존은 둘 중 먼저 걸리는 쪽이 적용된다. 시간 기준은 7d로
      # 두고, 크기 기준은 TSDB가 디스크를 무한히 먹지 않도록 하는 상한으로만 쓴다.
      # 3GB로 잡은 근거: prometheus_data volume은 VM2 root 디스크 위에 있고 그
      # 디스크에는 Docker 이미지와 백업 산출물이 함께 쌓인다. 현재 scrape 대상
      # 규모(호스트 3대 + 앱 4개)에서 7일치는 수백 MB 수준이므로 3GB는 평소에
      # 전혀 걸리지 않는다. 이번에 cAdvisor와 blackbox probe를 추가하면서
      # 시계열 수가 늘어나므로, 카디널리티가 예상 밖으로 커졌을 때 디스크를
      # 채우기 전에 오래된 블록부터 잘라 내게 하려는 안전장치다.
      - '--storage.tsdb.retention.size=3GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter (VM2 호스트 지표)
  # OBS-02: 이전 prometheus.yml의 vm2-node target은 localhost:9100이었고, 이 주소는
  # Prometheus 컨테이너 자신을 가리켜 아무 지표도 수집하지 못했다. 실제 exporter를
  # 같은 네트워크에 올리고 target을 node-exporter:9100으로 바꾼다.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: vm2-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # 백업 job이 마지막 성공 시각을 .prom 파일로 남기면 이 경로에서 읽는다.
      # basic.yml의 BackupStale 규칙이 그 지표를 사용한다.
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # 호스트의 textfile collector 디렉터리. 백업 job이 이 위치에 .prom 파일을
      # 원자적으로 교체해 두면 node-exporter가 다음 scrape에서 읽어 간다.
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - api-network
    restart: unless-stopped

  # Redis Exporter
  # OBS-02: 이전 redis target은 6379를 HTTP /metrics로 긁으려 했다. 그 포트는
  # Redis 프로토콜이므로 항상 실패한다. exporter를 두고 target을 9121로 바꾼다.
  redis-exporter:
    image: oliver006/redis_exporter:v1.78.0
    container_name: vm2-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - api-network
    restart: unless-stopped

  # Blackbox Exporter (HTTP probe)
  # OBS-03: Prometheus는 /metrics만 수집하므로 readiness 실패나 인증서 만료를
  # 나타내는 시계열이 없었다. blackbox exporter가 HTTP probe 결과를
  # probe_success와 probe_ssl_earliest_cert_expiry로 바꾸어 주고, 그 지표에
  # basic.yml의 blackbox 규칙이 붙는다.
  # 포트는 게시하지 않는다. Prometheus가 api-network 안에서만 호출한다.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: vm2-blackbox-exporter
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
      # 오리진 probe가 VM1의 인증서를 검증할 때 쓰는 신뢰 저장소다. VM1의
      # 인증서는 Cloudflare Origin CA가 서명한 것이라 공인 루트로는 검증되지
      # 않으므로, blackbox.yml의 http_2xx_origin 모듈이 tls_config.ca_file로
      # 이 파일을 지정한다. 이 줄이 없으면 컨테이너 안에 파일이 없어서 오리진
      # probe가 전부 실패한다. 공개 루트 인증서이므로 비밀이 아니다.
      - ./monitoring/blackbox/cloudflare-origin-ca.pem:/etc/blackbox_exporter/cloudflare-origin-ca.pem:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cAdvisor (컨테이너 단위 자원 사용량)
  # node-exporter는 호스트 전체만 보여 주므로 어떤 컨테이너가 CPU나 메모리를
  # 쓰고 있는지 구분할 수 없었다. 포트는 게시하지 않는다.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: vm2-cadvisor
    command:
      # compose 밖에서 docker run으로 띄운 컨테이너도 Docker가 관리하는 한
      # 포함된다. 반대로 systemd slice 같은 Docker 밖 cgroup은 제외되어
      # 시계열 수가 크게 줄어든다.
      - '--docker_only=true'
      # 기본 1초 간격은 이 규모에 과하다. scrape_interval이 15s이므로 30s면 충분하다.
      - '--housekeeping_interval=30s'
      # 카디널리티 관리: 컨테이너마다 core 수만큼 시계열이 생기는 percpu와,
      # 연결마다 늘어나는 tcp/udp 계열, 이번 규칙에서 쓰지 않는 수집기를 끈다.
      # 남기는 것은 cpu, memory, diskIO, network, oom_event 정도다.
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # 컨테이너 이름과 label을 읽기 위한 소켓이다. 읽기 전용으로 mount해도
      # Docker API 전체를 호출할 수 있는 권한이라는 점은 그대로다.
      #
      # 로그 수집기는 이번에 docker-socket-proxy를 거치도록 바꾸었지만 cAdvisor는
      # 소켓을 그대로 쓴다. cAdvisor는 이미 root로 동작하면서 호스트의 /sys와
      # /var/lib/docker를 읽으므로, Docker API만 좁혀도 실제 권한 수준이 달라지지
      # 않기 때문이다. 판단 근거는 monitoring/README.md의 "Docker API 접근 범위"
      # 항목에 적어 두었다.
      #
      # 프록시와 같은 이유로 long 문법에 create_host_path: false를 쓴다.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - api-network
    restart: unless-stopped

  # Alertmanager (기본 기동에서는 뜨지 않는다)
  # profiles를 붙였으므로 `docker compose up -d`로는 기동되지 않고,
  # `--profile alerting`을 붙였을 때에만 기동된다. Discord webhook URL을
  # 아직 발급받지 않았기 때문이며, receiver가 실제로 도달하지 못하는
  # Alertmanager를 상시로 띄워 두지 않는다는 기존 결정을 그대로 지킨다.
  #
  # 활성화 절차는 monitoring/README.md의 "통지 경로" 항목에 단계별로 적어 두었다.
  # webhook URL 파일은 이 저장소가 아니라 /opt/bnbong/secrets/에 둔다.
  # 저장소를 VM2로 전송하는 rsync의 대상 밖이어야 비밀이 덮어써지지 않는다.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: vm2-alertmanager
    profiles: ["alerting"]
    # 이미지의 기본값도 nobody(uid 65534)이지만 이름으로 지정되어 있다. 아래의
    # webhook URL 파일은 소유자를 uid 65534로 맞추어 두어야 읽히므로, 이미지
    # 기본값이 바뀌어도 그 전제가 깨지지 않도록 숫자로 못 박는다.
    # alertmanager_data volume은 이미지의 /alertmanager(65534:65534)를 그대로
    # 물려받으므로 이 uid로도 쓰기가 된다.
    user: "65534:65534"
    ports:
      # 외부에 게시하지 않는다. 확인할 때에는 SSH 터널을 쓴다.
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # webhook URL이 담긴 파일. 이 파일이 없으면 Alertmanager가 통지 시점에
      # 실패하므로, profile을 켜기 전에 반드시 만들어 두어야 한다.
      #
      # 소유자를 root로 두면 안 된다. 컨테이너는 uid 65534로 실행되므로 root
      # 소유 600 파일을 열지 못한다. 그런데 이 실패는 기동 시점이 아니라 통지
      # 시점에만 드러난다. Alertmanager는 설정을 읽을 때 이 파일을 건드리지
      # 않아서 컨테이너는 정상으로 뜨고 /-/healthy도 200을 돌려주며, 경보가
      # 실제로 발생한 뒤에야 "read webhook_url_file: permission denied"를
      # 남기고 통지를 버린다. 그래서 소유자를 65534:65534로 맞추고 권한은 600을
      # 유지한다. 절차는 monitoring/README.md의 "통지 경로" 항목에 있다.
      #
      # long 문법으로 적고 create_host_path를 false로 둔다. short 문법이면 파일이
      # 없을 때 Docker가 그 경로에 디렉터리를 만들고, Alertmanager는 그 디렉터리를
      # 그대로 mount한 채 정상으로 기동한다. 그러면 webhook URL이 없다는 사실이
      # 경보가 실제로 발생하는 순간까지 드러나지 않는다. 게다가 한 번 만들어진
      # 디렉터리는 나중에 같은 경로에 파일을 만들려 할 때 방해가 된다.
      # 이 옵션을 쓰면 파일이 없는 상태에서 alerting profile을 켤 때 기동 자체가
      # 실패하고 경로를 그대로 알려 준다.
      - type: bind
        source: /opt/bnbong/secrets/discord-webhook-url
        target: /run/secrets/discord_webhook_url
        read_only: true
        bind:
          create_host_path: false
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:12.2.1
    container_name: vm2-grafana
    ports:
      # VM1 Nginx가 10.0.1.60:3000으로 프록시하므로 private IP 바인딩이 필요하다.
      # 값이 비면 모든 인터페이스로 조용히 넓어지므로 `:?`로 중단시킨다.
      - "${VM2_PRIVATE_IP:?VM2_PRIVATE_IP must be set}:3000:3000"
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 값이 비면 Grafana가 기본 비밀번호(admin)로 뜨고, 그 화면은 VM1 Nginx를
      # 거쳐 monitoring.bnbong.com으로 공개된다. VM2_PRIVATE_IP와 같은 이유로
      # 조용히 넘어가지 않게 `:?`로 compose 단계에서 중단시킨다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_SERVER_ROOT_URL=https://monitoring.bnbong.com
      # 익명 열람과 회원가입을 명시적으로 막는다. 현재 Grafana 기본값도 같지만,
      # 공개 도메인에 붙어 있는 화면이므로 기본값에 기대지 않고 파일에 남긴다.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # 외부 접근은 항상 https://monitoring.bnbong.com이므로 session cookie를
      # HTTPS 전송으로 제한한다. SameSite=lax는 Grafana 기본값이지만, 위와 같은
      # 이유로 명시한다.
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      # 대시보드 provisioning. provider 정의와 대시보드 JSON을 분리해서 mount한다.
      # 둘 다 읽기 전용이므로 Grafana UI에서 고친 내용은 저장되지 않는다.
      # 대시보드는 저장소가 단일 출처이며, 고칠 때에는 JSON을 고쳐서 다시 배포한다.
      - ./monitoring/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - api-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki
  loki:
    image: grafana/loki:3.5.7
    container_name: vm2-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker socket proxy
  # Alloy가 컨테이너 목록과 로그를 읽으려면 Docker API가 필요하다. 소켓을 Alloy에
  # 직접 mount하는 대신 이 프록시를 앞에 둔다. 프록시는 HAProxy 하나만 실행하며
  # 아래 환경 변수로 허용한 경로 말고는 403으로 막는다. 쓰기 계열 method도 막히므로
  # Alloy가 컨테이너를 만들거나 exec을 실행할 수 있는 경로 자체가 사라진다.
  # 선택 근거는 monitoring/README.md의 "Docker API 접근 범위" 항목에 있다.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: vm2-docker-socket-proxy
    environment:
      # 컨테이너 목록 조회와 로그 조회에 필요한 최소 권한이다.
      # GET /containers/json 과 GET /containers/<id>/logs 가 여기에 속한다.
      - CONTAINERS=1
      # discovery.docker가 컨테이너마다 붙는 네트워크 label을 만들 때
      # GET /networks를 호출한다. 이 값을 0으로 두면 프록시가 403을 돌려주고
      # 대상 목록 갱신 자체가 실패한다. 실제로 기동해서 확인한 내용이다.
      #   err="error while computing network labels: ... 403 Forbidden"
      # 네트워크 목록 조회는 읽기 전용이므로 권한을 하나 더 여는 대가가 작다.
      - NETWORKS=1
      # 나머지는 기본값이 0이지만, 나중에 누가 늘리려 할 때 의도가 드러나도록
      # 위험한 항목을 명시적으로 꺼 둔다. POST를 0으로 두면 프록시가 GET과 HEAD
      # 말고는 전부 막으므로 컨테이너 생성과 삭제와 exec이 모두 차단된다.
      - POST=0
      - EXEC=0
      - CONTAINERS_CREATE=0
      - CONTAINERS_START=0
      - CONTAINERS_STOP=0
      - CONTAINERS_KILL=0
      - CONTAINERS_DELETE=0
      - IMAGES=0
      - VOLUMES=0
      - SECRETS=0
      - CONFIGS=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - SWARM=0
      - SYSTEM=0
      - PLUGINS=0
      - BUILD=0
      - COMMIT=0
      - DISTRIBUTION=0
      - SESSION=0
      - AUTH=0
      - INFO=0
    volumes:
      # 소켓을 실제로 들고 있는 컨테이너는 이 프록시 하나로 줄인다.
      #
      # long 문법으로 적고 create_host_path를 false로 둔다. short 문법은 원본
      # 경로가 없을 때 Docker가 그 자리에 디렉터리를 만들어 버리고, 그러면
      # 프록시는 기동에 성공한 뒤 모든 요청에 실패한다. 없으면 없다고 실패하는
      # 편이 낫다.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      # 전용 내부 네트워크에만 붙인다. api-network에 두면 gateway, auth-server,
      # wegis 같은 앱 컨테이너가 전부 docker-socket-proxy:2375로 Docker API를
      # 부를 수 있다. CONTAINERS=1은 컨테이너 inspect까지 허용하므로 다른
      # 컨테이너의 환경 변수가 그 경로로 읽힌다. 이 네트워크에 붙는 것은 이
      # 프록시와 Alloy 둘뿐이다.
      - docker-socket
    # 포트를 게시하지 않는다. docker-socket 네트워크 안에서 Alloy만 2375로 호출한다.
    restart: unless-stopped

  # Grafana Alloy (로그 수집)
  # Promtail을 대체한다. Promtail은 2026-03-02에 지원이 끝났다.
  # 설정은 ./monitoring/alloy/config.alloy 하나이며, 붙이는 label은 Promtail
  # 시절과 같다. 대시보드와 어드민 Explore 링크가 그 label에 의존한다.
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: vm2-alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      # 읽은 위치를 담는 저장소다. Promtail의 positions.yaml에 해당하며,
      # 컨테이너를 다시 만들어도 같은 로그를 처음부터 읽지 않도록 volume에 둔다.
      - alloy_data:/var/lib/alloy/data
      # Promtail이 남긴 positions.yaml을 읽기 위한 전환용 mount다. config.alloy의
      # loki.source.file이 legacy_positions_file로 이 파일을 한 번 읽어
      # --storage.path 아래의 positions.yml로 옮긴다. Alloy는 이 파일을 읽기만
      # 하고 지우거나 고쳐 쓰지 않으므로 :ro로 건다. v1.19.2로 직접 확인한
      # 결과, :ro 상태에서도 변환이 정상으로 끝나고 원본 파일은 그대로 남는다.
      # 전환이 끝나면 이 줄과 promtail_positions volume을 함께 없앤다.
      # 정리 절차는 monitoring/README.md의 "Promtail 잔여물 정리"에 있다.
      - promtail_positions:/var/lib/promtail:ro
    command:
      - run
      # 기본 listen 주소는 127.0.0.1:12345라서 다른 컨테이너에서 /metrics를 긁을 수
      # 없다. api-network 안에서만 닿게 하려고 0.0.0.0으로 열되 포트는 게시하지
      # 않는다. 즉 호스트와 외부에서는 이 주소에 접근할 수 없다.
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # pprof와 support bundle은 설정과 메모리 내용을 그대로 내보내는 창구다.
      # 디버깅용이므로 평소에는 닫아 둔다.
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle
      # 사용 중인 컴포넌트 목록을 Grafana Labs로 보내는 기능을 끈다.
      - --disable-reporting
      - /etc/alloy/config.alloy
    networks:
      # api-network는 Loki로 로그를 보내고 Prometheus가 12345번 포트를 긁기 위해
      # 필요하다. docker-socket은 컨테이너 목록과 로그를 읽는 프록시에 닿기 위해
      # 필요하다. Alloy만 두 네트워크에 함께 붙는다.
      - api-network
      - docker-socket
    depends_on:
      loki:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # 이 이미지에는 wget도 curl도 없다. bash의 /dev/tcp로 직접 요청을 보낸다.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "^HTTP/1.1 200" <&3'
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  # Alloy가 읽은 위치를 담는다. Promtail의 positions.yaml을 대신한다.
  alloy_data:
  # Promtail 시절의 positions.yaml이 들어 있다. Alloy는 첫 기동에서 이 내용을
  # 제 저장소로 옮긴 뒤로는 다시 읽지 않는다. 두 번째 기동부터는 새 positions
  # 파일이 이미 있다는 이유로 변환을 건너뛰며, 원본 파일은 Alloy가 지우지 않아
  # volume 안에 그대로 남는다. 손으로 지워야 하는 이유와 정리 절차는
  # monitoring/README.md의 "Promtail 잔여물 정리" 항목에 있다.
  promtail_positions:
  # alerting profile에서만 사용한다. silence와 notification log를 담는다.
  alertmanager_data:

networks:
  api-network:
    # core compose가 만드는 네트워크 이름과 같아야 한다.
    name: api-network
    external: true

  # docker-socket-proxy와 Alloy만 붙는 전용 네트워크다. compose가 project 이름을
  # 붙여서 bnbong_docker-socket으로 만든다.
  #
  # internal: true는 이 네트워크에 외부로 나가는 경로를 만들지 않는다. 프록시는
  # 호스트의 소켓 파일만 읽으면 되므로 바깥으로 나갈 일이 없고, 나갈 수 없는 편이
  # 안전하다.
  docker-socket:
    internal: true
